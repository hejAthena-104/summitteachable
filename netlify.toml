# ============================================================================
# SUPERSEDED 2026-07-22 — this site is no longer served by Netlify.
# It is now served from the Contabo VPS (156.67.28.100) by Caddy, out of this
# repo's frontend/ directory. The redirect rules below have been ported 1:1
# into the site block in /opt/swifteagle/Caddyfile.
#
# Kept as the historical record of the routing contract AND as the rollback
# path: repoint DNS at Netlify and this file is authoritative again.
# See DEPLOY-FRONTEND.md in this repo.
# ============================================================================

[build]
  publish = "frontend"

# ---- Homepage = the LIVE Django course catalog (proxy, URL stays summitteachable.com) ----
[[redirects]]
  from = "/"
  to = "https://dashboard.summitteachable.com/buy/"
  status = 200
  force = true

# Proxy the storefront's static assets so the proxied catalog's images/logo/fonts load.
# (The marketing pages use /css /js /images, so this only affects the Django storefront.)
[[redirects]]
  from = "/static/*"
  to = "https://dashboard.summitteachable.com/static/:splat"
  status = 200
  force = true

# Old marketing landing now lives at /home
[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200

# ---- Auth + storefront + dashboard go to the dashboard host ----
[[redirects]]
  from = "/auth/*"
  to = "https://dashboard.summitteachable.com/auth/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/login"
  to = "https://dashboard.summitteachable.com/auth/login/"
  status = 302
  force = true

[[redirects]]
  from = "/register"
  to = "https://dashboard.summitteachable.com/auth/register/"
  status = 302
  force = true

[[redirects]]
  from = "/buy/*"
  to = "https://dashboard.summitteachable.com/buy/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/dashboard/*"
  to = "https://dashboard.summitteachable.com/dashboard/:splat"
  status = 302
  force = true
